<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>万象棋 · 对局统计</title>
  <link rel="stylesheet" href="style.css" />
  <script src="app.js" defer></script>
</head>
<body>
  <p id="status" class="status" role="status" hidden></p>
  <main id="dashboard" class="dashboard" hidden>
    <aside class="players-panel" aria-label="玩家排名">
      <div class="panel-heading"><h2>玩家排行</h2><span class="muted">平均排名 ↑</span></div>
      <fieldset class="event-filter">
        <legend>赛事</legend>
        <label class="event-option event-all"><input id="event-all" type="checkbox" checked /><span>所有赛事</span></label>
        <div id="event-options" class="event-options"></div>
      </fieldset>
      <label class="search"><span class="sr-only">搜索玩家 ID</span><input id="search" type="search" placeholder="搜索玩家 ID" autocomplete="off" /></label>
      <div class="list-heading"><span>玩家 / 参赛场数</span><span>平均排名</span></div>
      <div id="player-list" class="player-list"></div>
      <p id="no-results" class="muted empty-search" hidden>未找到匹配的玩家</p>
    </aside>
    <section class="detail-panel" aria-labelledby="player-name" aria-busy="false">
      <div id="player-content" hidden>
        <div class="player-heading">
          <div class="player-identity">
            <p class="eyebrow">玩家表现</p>
            <label class="eyebrow" for="comparison-target">对比目标</label>
            <h2 id="player-name"></h2>
            <select id="comparison-target"><option value="">平均值</option></select>
          </div>
          <dl class="player-stats"><div><dt>平均排名</dt><dd id="average-rank"></dd></div><div><dt>参赛场数</dt><dd id="match-count"></dd></div></dl>
        </div>
        <div class="legend"><span><i class="player-dot"></i>当前玩家</span><span><i class="overall-dot"></i><span id="comparison-legend">玩家均值</span></span></div>
        <div class="comparison">
          <figure>
            <svg id="radar" viewBox="0 0 540 470" role="img" aria-labelledby="radar-title radar-description"></svg>
          </figure>
          <div class="values">
            <h3>平均数据</h3>
            <table>
              <thead><tr><th scope="col">维度</th><th scope="col">该玩家</th><th id="comparison-heading" scope="col">所有玩家</th></tr></thead>
              <tbody id="averages"></tbody>
            </table>
          </div>
        </div>
      </div>
      <p id="player-status" class="muted" role="status"></p>
    </section>
  </main>
</body>
</html>
