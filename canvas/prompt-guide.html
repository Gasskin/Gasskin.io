<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>提示词指南</title>
  <link rel="stylesheet" href="prompt-guide.css?v=20261030-images-1" />
</head>
<body>
  <main>
    <header class="guide-heading">
      <p class="eyebrow">PROMPT LIBRARY</p>
      <h1>提示词指南</h1>
      <p>复制提示词，或一键创建文本和关联图片节点。使用时按需替换【占位内容】。</p>
      <p class="config-hint">本地配置：canvas/prompt-guide.json · 每组包含 title（标题）、content（内容），可选 images（图片文件名数组）。图片放在 canvas/img/，例如 "images": ["正面.png", "背面.png"]。</p>
    </header>
    <p id="loadStatus" role="status">正在读取提示词…</p>
    <button id="retryButton" type="button">刷新提示词</button>
    <div id="promptList" class="prompt-list"></div>
    <p id="copyStatus" class="copy-status" role="status" aria-live="polite"></p>
  </main>
  <script src="prompt-guide.js?v=20261030-images-1"></script>
</body>
</html>
