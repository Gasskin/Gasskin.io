<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>画布</title>
  <link rel="stylesheet" href="style.css?v=20260909-prompt-guide-1" />
</head>
<body>
  <main class="workspace" aria-label="画布工作区">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>画布</h1>
          <p>把灵感放到同一个空间</p>
        </div>
      </div>

      <div class="topbar-actions">
        <button id="fitButton" class="action-button" type="button" title="将全部节点适应到当前屏幕">适应屏幕</button>
        <button id="promptGuideButton" class="action-button" type="button" aria-haspopup="dialog">提示词指南</button>
        <button id="settingsButton" class="icon-button" type="button" aria-label="打开 KIE 设置" title="KIE 设置">
          <span aria-hidden="true">&#9881;&#xfe0e;</span>
        </button>
      </div>

    </header>

    <section id="canvasViewport" class="canvas-viewport" aria-label="无限画布" tabindex="0">
      <div id="canvasPanLayer" class="canvas-pan-layer">
        <div id="canvasSurface" class="canvas-surface">
          <svg id="connectionLayer" class="connection-layer" aria-hidden="true">
            <g id="connectionList"></g>
            <path id="connectionDraft" class="connection-draft" d="" />
          </svg>
        </div>
      </div>

      <div id="selectionMarquee" class="selection-marquee" aria-hidden="true"></div>

      <div id="emptyGuide" class="empty-guide" aria-hidden="true">
        <div class="empty-icon"><span></span><span></span><span></span></div>
        <p>右键创建节点，或拖入一张图片</p>
        <small>滚轮缩放 · 左键拖动框选 · 中键拖动画布</small>
      </div>

      <div class="canvas-help" aria-hidden="true">
        <span><kbd>右键</kbd> 创建节点</span>
        <span><kbd>滚轮</kbd> 缩放</span>
        <span><kbd>左键拖动</kbd> 框选</span>
        <span><kbd>中键拖动</kbd> 平移</span>
      </div>

      <div class="zoom-control" aria-label="缩放控制">
        <button id="zoomOutButton" type="button" aria-label="缩小">−</button>
        <button id="zoomResetButton" class="zoom-value" type="button" title="重置为 100%">100%</button>
        <button id="zoomInButton" type="button" aria-label="放大">＋</button>
      </div>

      <div id="dropOverlay" class="drop-overlay" aria-hidden="true">
        <div>
          <span class="drop-symbol" aria-hidden="true">↓</span>
          <strong>放开以创建图片节点</strong>
          <small>支持同时拖入多张图片</small>
        </div>
      </div>
    </section>

    <div id="contextMenu" class="context-menu" role="menu" aria-hidden="true">
      <p>创建节点</p>
      <button id="createImageNodeButton" type="button" role="menuitem">
        <span class="menu-icon" aria-hidden="true">▧</span>
        <span><strong>图片节点</strong></span>
      </button>
      <button id="createTextNodeButton" type="button" role="menuitem">
        <span class="menu-icon text" aria-hidden="true">T</span>
        <span><strong>文本节点</strong></span>
      </button>
      <button id="createKieNodeButton" type="button" role="menuitem">
        <span class="menu-icon kie" aria-hidden="true">K</span>
        <span><strong>KIE Image2</strong></span>
      </button>
      <div class="menu-coming-soon">更多节点即将加入</div>
    </div>

  </main>

  <dialog id="promptGuideDialog" class="prompt-guide-dialog" aria-labelledby="promptGuideTitle">
    <header class="prompt-guide-bar">
      <h2 id="promptGuideTitle">提示词指南</h2>
      <button id="promptGuideClose" class="action-button" type="button" autofocus>返回画布</button>
    </header>
    <iframe id="promptGuideFrame" title="本地提示词列表"></iframe>
  </dialog>

  <dialog id="previewDialog" class="preview-dialog">
    <button id="previewCloseButton" class="preview-close" type="button" aria-label="关闭预览">×</button>
    <figure>
      <img id="previewImage" alt="图片预览" />
      <figcaption id="previewCaption"></figcaption>
    </figure>
  </dialog>

  <dialog id="settingsDialog" class="settings-dialog" aria-labelledby="settingsTitle">
    <div class="settings-shell">
      <header class="settings-head">
        <div>
          <p>KIE provider</p>
          <h2 id="settingsTitle">KIE Image2 设置</h2>
        </div>
        <button id="settingsCloseButton" class="dialog-close" type="button" aria-label="关闭设置">×</button>
      </header>
      <div class="settings-content">
        <label class="settings-field">
          <span>Base URL</span>
          <input id="kieBaseUrl" type="url" autocomplete="off" spellcheck="false" placeholder="https://api.kie.ai" />
          <small>创建任务与任务查询路径会自动拼接到此地址。</small>
        </label>
        <label class="settings-field">
          <span>Upload Base URL</span>
          <input id="kieUploadBaseUrl" type="url" autocomplete="off" spellcheck="false" placeholder="https://kieai.redpandaai.co" />
          <small>本地图片会先上传到 KIE 临时文件服务，再用于图生图。</small>
        </label>
        <label class="settings-field">
          <span>API Key</span>
          <span class="settings-token-field">
            <input id="kieApiKey" type="password" autocomplete="off" placeholder="输入 KIE API Key" />
            <button id="kieApiKeyClear" type="button">清除</button>
          </span>
          <small>仅保存在当前浏览器的 localStorage 中。</small>
        </label>
        <section class="model-groups-section" aria-labelledby="kieModelGroupsTitle">
          <div class="model-groups-heading">
            <h3 id="kieModelGroupsTitle">模型分组</h3>
            <button id="kieAddModelGroup" class="settings-button secondary" type="button">添加分组</button>
          </div>
          <p class="model-groups-help">每组包含文生图和图生图模型，连接图片后自动切换。勾选默认分组，新建节点将优先使用该组。</p>
          <div id="kieModelGroups" class="model-groups-list"></div>
        </section>
        <label class="settings-field">
          <span>新建节点默认分辨率</span>
          <select id="kieDefaultResolution"></select>
        </label>
        <label class="settings-field">
          <span>新建节点默认比例</span>
          <select id="kieDefaultRatio"></select>
        </label>
        <p id="kieConfigNotice" class="model-groups-help"></p>
        <p id="settingsMessage" class="settings-message" role="status" aria-live="polite"></p>
      </div>
      <footer class="settings-actions">
        <button id="settingsCancelButton" class="settings-button secondary" type="button">取消</button>
        <button id="settingsSaveButton" class="settings-button primary" type="button">保存设置</button>
      </footer>
    </div>
  </dialog>

  <dialog id="generationDetailsDialog" class="details-dialog" aria-labelledby="generationDetailsTitle">
    <div class="details-shell">
      <header class="details-head">
        <div>
          <p>KIE Image2</p>
          <h2 id="generationDetailsTitle">调用详情</h2>
        </div>
        <button id="generationDetailsClose" class="dialog-close" type="button" aria-label="关闭调用详情">×</button>
      </header>
      <div id="generationDetailsSummary" class="details-summary">
        <div><span>状态</span><strong id="generationDetailsStatus">—</strong></div>
        <div><span>花费时间</span><strong id="generationDetailsElapsed">—</strong></div>
      </div>
      <div class="details-code-head">
        <span id="generationDetailsCodeLabel">cURL</span>
        <small id="generationDetailsTokenNote">API Key 已隐藏</small>
      </div>
      <pre id="generationDetailsCode" class="details-code"></pre>
    </div>
  </dialog>

  <template id="kieModelGroupTemplate">
    <div class="model-group-card">
      <div class="model-group-actions">
        <label class="model-group-default-label"><input class="model-group-default" type="checkbox" />默认分组</label>
        <button class="model-group-remove" type="button">删除分组</button>
      </div>
      <label class="settings-field">
        <span>分组名称</span>
        <input class="model-group-name" type="text" placeholder="例如：GPT Image2" autocomplete="off" />
      </label>
      <label class="settings-field">
        <span>文生图模型</span>
        <input class="model-group-text" type="text" placeholder="gpt-image-2-text-to-image" autocomplete="off" spellcheck="false" />
      </label>
      <label class="settings-field">
        <span>图生图模型</span>
        <input class="model-group-image" type="text" placeholder="gpt-image-2-image-to-image" autocomplete="off" spellcheck="false" />
      </label>
    </div>
  </template>
  <script src="app.js?v=20260909-guide-create-text-1"></script>
</body>
</html>
