<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>万象棋 · 对局统计</title>
  <link rel="stylesheet" href="style.css" />
  <script src="app.js" defer></script>
</head>
<body>
  <p id="status" class="status" role="status" hidden></p>
  <div id="dashboard" class="app" hidden>
    <nav class="view-tabs" role="tablist" aria-label="数据视图">
      <button id="tab-players" class="view-tab" type="button" role="tab" data-view="players" aria-selected="true" aria-controls="players-view">玩家数据</button>
      <button id="tab-heroes" class="view-tab" type="button" role="tab" data-view="heroes" aria-selected="false" aria-controls="heroes-view">棋手数据</button>
    </nav>

    <main id="players-view" class="dashboard" role="tabpanel" aria-labelledby="tab-players">
      <aside class="players-panel" aria-label="玩家排名">
        <div class="panel-heading"><h2>玩家排行</h2></div>
        <label class="search"><span class="sr-only">搜索玩家 ID</span><input id="search" type="search" placeholder="搜索玩家 ID" autocomplete="off" /></label>
        <div id="player-sort" class="list-heading" role="group" aria-label="玩家排序方式">
          <span>玩家 / 场数</span>
          <button type="button" class="sort-col" data-sort="averageRank" aria-pressed="true">平均排名<span class="sort-arrow" aria-hidden="true">↑</span></button>
          <button type="button" class="sort-col" data-sort="winRate" aria-pressed="false">胜率<span class="sort-arrow" aria-hidden="true">↓</span></button>
          <button type="button" class="sort-col" data-sort="top3Rate" aria-pressed="false">前三率<span class="sort-arrow" aria-hidden="true">↓</span></button>
        </div>
        <div id="player-list" class="player-list"></div>
        <p id="no-results" class="muted empty-search" hidden>未找到匹配的玩家</p>
      </aside>
      <section class="detail-panel" aria-labelledby="player-name" aria-busy="false">
        <div id="player-content" hidden>
          <div class="player-heading">
            <div class="player-identity">
              <p class="eyebrow">当前玩家</p>
              <label class="eyebrow" for="comparison-target">对比目标</label>
              <h2 id="player-name"></h2>
              <div class="comparison-picker">
                <span id="comparison-value" aria-hidden="true">平均值</span>
                <select id="comparison-target"><option value="">平均值</option></select>
              </div>
            </div>
            <dl class="player-stats">
              <div><dt>平均排名</dt><dd id="average-rank"></dd></div>
              <div><dt>胜率</dt><dd id="win-rate"></dd></div>
              <div><dt>前三率</dt><dd id="top3-rate"></dd></div>
              <div><dt>参赛场数</dt><dd id="match-count"></dd></div>
            </dl>
          </div>
          <div class="legend"><span><i class="player-dot"></i><span id="player-legend"></span></span><span><i class="overall-dot"></i><span id="comparison-legend">玩家均值</span></span></div>
          <div class="comparison">
            <figure>
              <svg id="radar" viewBox="0 0 540 470" role="img" aria-labelledby="radar-title radar-description"></svg>
            </figure>
            <div class="values">
              <div class="section-heading">
                <h3>使用棋手</h3>
                <span id="player-heroes-summary" class="muted"></span>
              </div>
              <div class="table-wrap">
                <table class="lineups-table">
                  <thead id="player-hero-sort">
                    <tr>
                      <th scope="col">棋手 / 阵容</th>
                      <th scope="col"><button type="button" class="sort-col" data-sort="matchCount" aria-pressed="false">场数<span class="sort-arrow" aria-hidden="true">↓</span></button></th>
                      <th scope="col"><button type="button" class="sort-col" data-sort="usageRate" aria-pressed="true">使用率<span class="sort-arrow" aria-hidden="true">↓</span></button></th>
                      <th scope="col"><button type="button" class="sort-col" data-sort="averageRank" aria-pressed="false">平均排名<span class="sort-arrow" aria-hidden="true">↑</span></button></th>
                      <th scope="col"><button type="button" class="sort-col" data-sort="winRate" aria-pressed="false">胜率<span class="sort-arrow" aria-hidden="true">↓</span></button></th>
                      <th scope="col"><button type="button" class="sort-col" data-sort="top3Rate" aria-pressed="false">前三率<span class="sort-arrow" aria-hidden="true">↓</span></button></th>
                    </tr>
                  </thead>
                  <tbody id="player-heroes"></tbody>
                </table>
              </div>
              <p id="no-player-heroes" class="muted empty-table" hidden>暂无棋手记录</p>
            </div>
          </div>
        </div>
        <p id="player-status" class="muted" role="status"></p>
      </section>
    </main>

    <section id="heroes-view" class="lineups-panel" role="tabpanel" aria-labelledby="tab-heroes" hidden>
      <div class="lineups-toolbar">
        <div class="lineups-title">
          <h2>棋手数据</h2>
          <span id="hero-total" class="muted"></span>
        </div>
        <label class="lineup-search"><span class="sr-only">搜索棋手或阵容</span><input id="hero-search" type="search" placeholder="搜索棋手或阵容" autocomplete="off" /></label>
      </div>
      <div class="table-scroll">
        <table class="lineups-table global-lineups-table">
          <thead id="hero-sort">
            <tr>
              <th scope="col">#</th>
              <th scope="col">棋手 / 阵容</th>
              <th scope="col"><button type="button" class="sort-col" data-sort="matchCount" aria-pressed="false">出场次数<span class="sort-arrow" aria-hidden="true">↓</span></button></th>
              <th scope="col"><button type="button" class="sort-col" data-sort="averageRank" aria-pressed="true">平均排名<span class="sort-arrow" aria-hidden="true">↑</span></button></th>
              <th scope="col"><button type="button" class="sort-col" data-sort="winRate" aria-pressed="false">胜率<span class="sort-arrow" aria-hidden="true">↓</span></button></th>
              <th scope="col"><button type="button" class="sort-col" data-sort="top3Rate" aria-pressed="false">前三率<span class="sort-arrow" aria-hidden="true">↓</span></button></th>
            </tr>
          </thead>
          <tbody id="hero-list"></tbody>
        </table>
        <p id="no-heroes" class="muted empty-table" hidden>暂无匹配的棋手数据</p>
      </div>
    </section>
  </div>
</body>
</html>
